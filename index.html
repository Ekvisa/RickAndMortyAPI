<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./pics/portal.png" type="image/x-icon" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Rick and Morty Characters</h1>
        <p id="quote">Wubba Lubba Dub Dub!</p>
      </div>
      <input
        id="search"
        type="text"
        placeholder="Search by name..."
        class="search"
        autocomplete="off"
      />
      <div class="buttons">
        <button type="button" class="prev">Previous</button>
        <button type="button" class="next">Next</button>
      </div>
      <div class="pages">
        page <span id="currentPage"></span> of <span id="totalPages"></span>
      </div>
    </header>
    <main>
      <p id="loading">Подождите, идёт синхронизация с измерением C-137...</p>
    </main>
    <footer>
      <button type="button" class="prev">&lt</button>
      <button type="button" class="next">&gt</button>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
